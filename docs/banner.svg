<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Asistente Alfred</title>
  <desc id="desc">Mayordomo de voz para Alexa que responde con Claude</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1729"/>
      <stop offset="0.55" stop-color="#1b1f3b"/>
      <stop offset="1" stop-color="#2d1f3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a458" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e0a458" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c77a"/>
      <stop offset="1" stop-color="#c98a3c"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>

  <!-- Emblem: speaker ring with sound waves and a butler's bow tie -->
  <g transform="translate(250 200)">
    <circle r="190" fill="url(#glow)"/>
    <g fill="none" stroke="#e0a458" stroke-linecap="round">
      <path d="M -150 -62 A 162 162 0 0 0 -150 62" stroke-width="6" stroke-opacity="0.25"/>
      <path d="M -126 -48 A 132 132 0 0 0 -126 48" stroke-width="6" stroke-opacity="0.45"/>
      <path d="M 150 -62 A 162 162 0 0 1 150 62" stroke-width="6" stroke-opacity="0.25"/>
      <path d="M 126 -48 A 132 132 0 0 1 126 48" stroke-width="6" stroke-opacity="0.45"/>
    </g>
    <circle r="100" fill="#141a30" stroke="url(#gold)" stroke-width="5"/>
    <circle r="84" fill="none" stroke="#e0a458" stroke-opacity="0.25" stroke-width="2"/>
    <!-- bow tie -->
    <g fill="url(#gold)">
      <path d="M -62 -30 Q -70 0 -62 30 L -12 8 L -12 -8 Z"/>
      <path d="M 62 -30 Q 70 0 62 30 L 12 8 L 12 -8 Z"/>
      <rect x="-14" y="-14" width="28" height="28" rx="7"/>
    </g>
    <path d="M -50 -16 L -24 -4 M -50 16 L -24 4 M 50 -16 L 24 -4 M 50 16 L 24 4"
          stroke="#141a30" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="490" y="168" font-size="76" font-weight="700" fill="#f5f1e8" letter-spacing="-1">Asistente Alfred</text>
    <text x="492" y="216" font-size="27" fill="#c9c3d6">Mayordomo de voz para Alexa, con respuestas de Claude</text>
    <text x="492" y="256" font-size="22" fill="#e0a458" font-style="italic">«A sus órdenes. ¿En qué puedo ayudarle?»</text>

    <g font-size="18" font-weight="600" fill="#f5f1e8">
      <g transform="translate(492 292)">
        <rect width="58" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="29" y="24" text-anchor="middle">Go</text>
      </g>
      <g transform="translate(562 292)">
        <rect width="90" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="45" y="24" text-anchor="middle">Claude</text>
      </g>
      <g transform="translate(664 292)">
        <rect width="132" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="66" y="24" text-anchor="middle">AWS Lambda</text>
      </g>
      <g transform="translate(808 292)">
        <rect width="118" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="59" y="24" text-anchor="middle">DynamoDB</text>
      </g>
      <g transform="translate(938 292)">
        <rect width="118" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="59" y="24" text-anchor="middle">Terraform</text>
      </g>
      <g transform="translate(1068 292)">
        <rect width="136" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="68" y="24" text-anchor="middle">Open-Meteo</text>
      </g>
    </g>
  </g>
</svg>
